name: Deploy Recetario to Ionos (SFTP)

# Se activa automáticamente con cada push a main, y también manualmente
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 🍲 Desplegar Recetario a producción
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔍 Debug de Secreto (Seguro)
        run: |
          echo "La contraseña tiene ${#PASS} caracteres."
        env:
          PASS: ${{ secrets.SFTP_PASS }}

      - name: 📤 Subir archivos del Recetario al servidor
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

          # Crear directorio remoto si no existe
          sshpass -p "${{ secrets.SFTP_PASS }}" ssh -p 22 -o StrictHostKeyChecking=no \
            ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }} \
            "mkdir -p ${{ secrets.SFTP_REMOTE_PATH }}/../recetario"

          # Subir todos los archivos del recetario (excluye carpetas de imágenes del libro físico)
          sshpass -p "${{ secrets.SFTP_PASS }}" scp -P 22 -o StrictHostKeyChecking=no \
            index.html \
            ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_REMOTE_PATH }}/../recetario/

          # Subir carpetas de assets
          for dir in css js img data; do
            sshpass -p "${{ secrets.SFTP_PASS }}" scp -P 22 -o StrictHostKeyChecking=no -r \
              ./$dir \
              ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_REMOTE_PATH }}/../recetario/
          done

          echo "✅ Recetario desplegado correctamente en producción."
